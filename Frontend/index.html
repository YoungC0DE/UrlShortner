<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="api-base" content="https://ulnk.com.br" />
    <title>uLnk — URL shortener</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Comic+Relief:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./assets/styles.css" />
    <link rel="icon" href="./assets/favicon.ico" type="image/x-icon" />
  </head>
  <body>
    <main class="wrap">
      <h1 class="title">uLnk</h1>
      <p class="tagline">Shorten links in one click.</p>

      <form id="form" class="form" novalidate>
        <label class="label" for="url">Original URL</label>
        <input
          id="url"
          name="url"
          type="url"
          class="input"
          placeholder="https://example.com/page"
          autocomplete="url"
          required
        />
        <button type="submit" class="btn btn-primary" id="submit">
          Shorten
        </button>
      </form>

      <div id="result" class="result" aria-live="polite" hidden></div>
    </main>
    <script src="./assets/app.js"></script>
  </body>
</html>
